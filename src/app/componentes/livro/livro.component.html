<section [ngClass]="livro().genero.id">
    
    <button class="favorito-btn" (click)="alternarFavorito()">
    <!-- // aqui temos um event binding  -->
        <span>
            {{ livro().favorito? '\u2764': '\u2661'}}
        </span>
    </button>
    <div class="imagem">
        <img [src]="livro().imagem" [alt]="livro().titulo"> 
        <!-- // aqui temos um property binding, onde o valor da propriedade src do elemento img é igual ao valor da propriedade imagem do objeto livro -->
        <!-- // o mesmo acontece com o alt, onde o valor da propriedade alt do elemento img é igual ao valor da propriedade titulo do objeto livro -->
        <!-- // o property binding é uma forma de fazer a ligação entre o componente e a view -->
        <!-- // onde a informação sai do typescript e vai para o html -->
    </div>
    <div class="info-livro">
        <h2 class="texto-h2">{{livro().titulo}}</h2>
         <!-- // aqui usamos o {{}} para fazer a interpolação de dados -->
          <!-- // essa interpolação de dados é feita através do data binding -->
         <!---  // data binding é a ligação entre o componente e a view -->
         <!-- // neste caso temos um fluxo unidirecional de dados, ou seja, os dados vão do componente para a view  -->
        <!-- // chamado tbm de one way data binding -->
        <!-- // onde a informação sai do typescript e vai para o html -->
         <h3 class="texto-h3">{{livro().autoria}}</h3>
    </div>
</section>
